[project]
name = "automated-business-auditor"
version = "0.1.0"
description = "Enterprise-grade compliance orchestration platform"
readme = "README.md"
authors = [
    { name = "ironspiritjeff", email = "ironspiritjeff@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
automated-business-auditor = "app.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
